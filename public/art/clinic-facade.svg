  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#e3e7ea"/><stop offset="1" stop-color="#c6ccd2"/>
  </linearGradient>
  <linearGradient id="toothw" x1="0" y1="0" x2="0" y2="1">
