   <g transform="translate(672 260) scale(0.34)">
    <path d="M0-52c-11-7-24-8-34-2-12 7-16 20-14 35 2 12 6 23 10 34 3 8 5 17 8 22 3 6 9 6 12-1 4-7 4-17 5-25 1-8 3-13 13-13s12 5 13 13c1 8 1 18 5 25 3 7 9 7 12 1 3-5 5-14 8-22 4-11 8-22 10-34 2-15-2-28-14-35-10-6-23-5-34 2Z" fill="url(#goldg)"/>
    <path d="M-30-36c3-8 9-13 17-15" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>
